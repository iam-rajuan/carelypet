services:
  proxy:
    image: nginx:1.27-alpine
    container_name: carelypet-proxy
    depends_on:
      - dashboard
      - backend
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/www:/var/www/certbot
    restart: unless-stopped

  dashboard:
    build:
      context: ./carelypet-dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    container_name: carelypet-dashboard
    restart: unless-stopped

  backend:
    build:
      context: ./carelypet-backend
      dockerfile: Dockerfile
    container_name: carelypet-backend
    env_file:
      - ./carelypet-backend/.env
    environment:
      NODE_ENV: production
      PORT: 5191
      MONGO_URI: mongodb://mongo:27017/carelypet_db
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: carelypet-mongo
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo_data:
