services:
  proxy:
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    ports:
      - "${PROXY_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/default-ssl.conf.template:/etc/nginx/templates/default-ssl.conf.template:ro
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
    command: >-
      /bin/sh -c "envsubst '$$DOMAIN_NAME'
      < /etc/nginx/templates/default-ssl.conf.template
      > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    container_name: carelypet-certbot
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do sleep 12h & wait $$!; certbot renew --webroot -w /var/www/certbot; done"
    restart: unless-stopped
